# Email account lifecycle against the Firebase emulators:
# sign up -> verify (emulator link) -> Home -> drawer shows the name -> sign out -> sign in
# -> delete account -> back at Landing, account and profile gone.
# Needs the emulators and an emulator build; see README "End-to-end tests (Maestro)".
appId: ${APP_ID || 'com.qdmobile.dev'}
name: Auth - email sign-up to account deletion
tags:
  - auth
  - emulators
env:
  PASSWORD: Passw0rd!e2e
---
- runScript: scripts/new-email.js
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Already have an account?"
    timeout: 60000

# Sign up (no date of birth: optional since D16)
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Sign up with Email"
    timeout: 10000
- tapOn: "Sign up with Email"
- tapOn:
    id: "Email"
- inputText: ${output.email}
- tapOn:
    id: "First name"
- inputText: "Ada"
- tapOn:
    id: "Last name"
- inputText: "Lovelace"
# Small screens: the keyboard covers the lower fields, so hide it and scroll before each tap
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "Password"
    direction: DOWN
- tapOn:
    id: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "Confirm password"
    direction: DOWN
- tapOn:
    id: "Confirm password"
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "sign-up-cta"
    direction: DOWN
- tapOn:
    id: "sign-up-cta"

# VerifyEmail: the session moved here by itself
- extendedWaitUntil:
    visible: "I've verified my email"
    timeout: 30000
- assertVisible: ".*${output.email}.*"
- runScript:
    file: scripts/verify-email.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}
- runScript:
    file: scripts/assert-profile.js
    env:
      UID: ${output.uid}
- tapOn:
    id: "verified-cta"

# Home, drawer with the profile name
- extendedWaitUntil:
    visible: "Welcome!"
    timeout: 30000
- tapOn:
    id: "drawer-menu-button"
- assertVisible: "Ada Lovelace"
- assertVisible: ${output.email}
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Already have an account?"
    timeout: 15000

# Sign in again
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in with Email"
    timeout: 10000
- tapOn: "Sign in with Email"
- tapOn:
    id: "Email"
- inputText: ${output.email}
- tapOn:
    id: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-cta"
- extendedWaitUntil:
    visible: "Welcome!"
    timeout: 30000

# Delete the account (recent login, so no password prompt)
- tapOn:
    id: "drawer-menu-button"
- tapOn: "Delete account"
- extendedWaitUntil:
    visible: "Are you sure?"
    timeout: 10000
- tapOn:
    id: "delete-account-cta"
- extendedWaitUntil:
    visible: "Already have an account?"
    timeout: 30000

# onUserDeleted removes users/{uid} asynchronously
- retry:
    maxRetries: 5
    commands:
      - extendedWaitUntil:
          visible: "__pause__"
          timeout: 3000
          optional: true
      - runScript:
          file: scripts/assert-deleted.js
          env:
            EMAIL: ${output.email}
            PASSWORD: ${PASSWORD}
            UID: ${output.uid}
