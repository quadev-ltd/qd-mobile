# Navigation: Landing -> Sign in -> Sign up -> Sign in, plus the back gesture.
appId: ${APP_ID || 'com.qdmobile.dev'}
name: Public navigation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Already have an account?"
    timeout: 60000
# Landing -> Sign in
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Don't have an account?"
    timeout: 10000
- assertVisible: "Sign in with Google"
# Sign in -> Sign up (footer link)
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Sign up with Google"
    timeout: 10000
- assertVisible: "Already have an account?"
# Sign up -> Sign in goes back to the existing Sign in screen (React Navigation v6 behaviour)
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Don't have an account?"
    timeout: 10000
# Back returns to Landing
- back
- extendedWaitUntil:
    visible: "Already have an account?"
    timeout: 10000
- assertVisible:
    text: "Sign up"
