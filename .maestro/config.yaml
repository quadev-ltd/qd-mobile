# Maestro end-to-end flows: the two critical paths only (the detailed cases are Jest tests).
# They need the Firebase emulators and a development build bundled with
# EXPO_PUBLIC_USE_FIREBASE_EMULATORS=true (see README "End-to-end tests (Maestro)"):
#   maestro test .maestro
#     auth-email-lifecycle.yaml  sign up -> verify -> home -> sign out -> sign in -> delete
#     auth-sign-in-errors.yaml   wrong password, forgot password (neutral message, reset email queued)
flows:
  - "auth-*.yaml"
