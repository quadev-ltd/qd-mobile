# Sign-in errors and forgot password against the Firebase emulators:
# wrong password -> "Invalid email or password"; forgot password -> neutral message and a reset
# email queued in the Auth emulator. (The unknown-email case is covered by ForgotPasswordForm.spec.tsx.)
# Needs the emulators and an emulator build; see README "End-to-end tests (Maestro)".
# Android dev package by default; on the iOS simulator run with -e APP_ID=com.qdmobile.dev.
appId: ${APP_ID || 'net.quadev.app.dev'}
name: Auth - sign-in errors and forgot password
tags:
  - auth
  - emulators
env:
  PASSWORD: Passw0rd!e2e
---
- runScript: scripts/new-email.js
- runScript:
    file: scripts/create-account.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Already have an account?"
    timeout: 60000
- tapOn: "Sign in"
- tapOn: "Sign in with Email"
- tapOn:
    id: "Email"
- inputText: ${output.email}
- tapOn:
    id: "Password"
- inputText: "Wr0ngPassword!"
- hideKeyboard
- tapOn:
    id: "sign-in-cta"
- extendedWaitUntil:
    visible: "Invalid email or password"
    timeout: 15000

# Forgot password: the app pre-fills the email from the sign-in form (no retyping: Android's
# eraseText deletes backwards from the tap position and can leave characters behind)
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible: "Reset password"
    timeout: 10000
- tapOn:
    id: "forgot-password-cta"
- extendedWaitUntil:
    visible: "If an account exists for that email.*"
    timeout: 15000
- runScript:
    file: scripts/assert-reset-email.js
    env:
      EMAIL: ${output.email}
