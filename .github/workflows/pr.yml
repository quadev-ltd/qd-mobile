name: CI Workflow Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    container:
      image: tavoargento/react-native-android-ci:0.0.1
    env:
      STORE_FILE: ${{ secrets.STORE_FILE }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      STORE_ALIAS: ${{ secrets.STORE_ALIAS }}
      STORE_KEY_PASSWORD: ${{ secrets.STORE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: yarn install

      - name: Install Gems
        run: bundle install

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_PROD_JSON }}" | base64 -d > ./android/app/src/production/google-services.json

      - name: Decode .env.prod file
        run: echo "${{ secrets.ENV_PROD }}" | base64 -d > ./.env.prod

      - name: Decode release key file
        run: echo "${{ secrets.STORE_FILE_CONTENT }}" | base64 -d > ./android/app/release-key.keystore

      - name: Decode Google Play key
        run: echo "${{ secrets.GOOGLE_PLAY_KEY }}" | base64 -d > ./android/google-play-key.json

      - name: Build Android Release App
        run: cd android && ./gradlew clean && ./gradlew bundleProductionRelease

      - name: Verify built AAB manifest and hash
        run: |
          cd android
          echo "Downloading bundletool..."
          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          echo "Dumping manifest (full) from AAB:"
          java -jar bundletool.jar dump manifest \
            --bundle app/build/outputs/bundle/productionRelease/app-production-release.aab || true
          echo "Extracting min/target SDK via XPath (best effort):"
          java -jar bundletool.jar dump manifest \
            --bundle app/build/outputs/bundle/productionRelease/app-production-release.aab \
            --xpath 'concat("min=", string(/manifest/uses-sdk/@android:minSdkVersion), ", target=", string(/manifest/uses-sdk/@android:targetSdkVersion))' || true
          java -jar bundletool.jar dump manifest \
            --bundle app/build/outputs/bundle/productionRelease/app-production-release.aab \
            --xpath 'concat("min=", string(/manifest/uses-sdk/@minSdkVersion), ", target=", string(/manifest/uses-sdk/@targetSdkVersion))' || true
          echo "AAB file details:"
          ls -lh app/build/outputs/bundle/productionRelease/app-production-release.aab
          (sha256sum app/build/outputs/bundle/productionRelease/app-production-release.aab || shasum -a 256 app/build/outputs/bundle/productionRelease/app-production-release.aab) || true

      - name: Scan native libs for 16KB-page compatibility
        run: |
          cd android
          AAB=app/build/outputs/bundle/productionRelease/app-production-release.aab
          TMPDIR=$(mktemp -d)
          unzip -q "$AAB" -d "$TMPDIR/aab"
          # Native libs are stored under base/lib/<abi> in AABs
          if [ ! -d "$TMPDIR/aab/base/lib" ]; then
            echo "No base/lib directory found in AAB; skipping native lib scan."
            exit 0
          fi
          echo "Checking PT_LOAD p_align for native libs (expect <= 0x4000)"
          FOUND_ISSUE=0
          if command -v llvm-readelf >/dev/null 2>&1; then READELF=llvm-readelf; else READELF=readelf; fi
          find "$TMPDIR/aab/base/lib" -type f -name '*.so' | while read -r so; do
            echo "-- $so"
            $READELF -l "$so" | awk '/Program Headers:/{p=1} p && /LOAD/{print} /Section to Segment mapping/{p=0}'
            # Heuristic: flag if any LOAD segment p_align > 0x4000
            if $READELF -l "$so" | awk '/LOAD/ {print $0}' | grep -Eqi 'Align[^0-9a-fA-F]*0x([4-9][0-9a-fA-F]{3}|[1-9][0-9a-fA-F]{4,})'; then
              echo "Potential issue: alignment appears > 0x4000"
              FOUND_ISSUE=1
            fi
          done
          if [ "$FOUND_ISSUE" = "1" ]; then
            echo "One or more native libraries may be incompatible with 16KB page size."
          else
            echo "No obvious alignment issues detected."
          fi

      - name: Distribute to Google Play
        run: |
          cd android
          bundle exec fastlane android deploy_to_play_store

  build-ios-release:
    runs-on: macos-14
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Add firebase services file
        run: |
          cd ios/QDMobile
          mkdir -p firebase/prod
          cd -
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PROD_PLIST }}" | base64 -d > ./ios/QDMobile/firebase/prod/GoogleService-Info.plist
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PROD_PLIST }}" | base64 -d > ./ios/QDMobile/GoogleService-Info.plist

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.3.app

      - name: Install Gems
        run: bundle install

      - name: Install Pods
        run: |
          cd ios
          bundle exec pod install

      - name: Decode .env.prod file
        run: |
          echo "${{ secrets.ENV_PROD }}" | base64 -d > ./.env.prod

      - name: Decode AppStore Authentication key
        run: |
          echo "${{ secrets.APPSTORE_AUTH_KEY }}" | base64 -d > ./ios/AuthKey_68JCD4JV8Q.p8

      - name: Build and distribute IPA
        run: |
          cd ios
          bundle exec fastlane ios build_and_distribute_release_app

      - name: Print Fastlane log file
        if: failure() # This ensures the log is only printed if the previous step fails
        run: |
          grep -i -B 2 -A 4 "error:" /Users/runner/Library/Logs/gym/QDMobile-QDMobile.log || true
